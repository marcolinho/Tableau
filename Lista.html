<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrimonio — Lista Tavoli</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #b8860b;
    --gold-light: #d4a017;
    --bg: #f5f0e8;
    --bg-warm: #ede8dc;
    --bg-card: #ffffff;
    --ink: #1a2e4a;
    --ink-mid: #2c4a6e;
    --blue: #5b8db8;
    --blue-light: #7aafd4;
    --blue-pale: #b8d4e8;
    --blue-dim: #8aafc9;
    --strip-bg: #d8cfc0;
    --strip-hole: #c0b8a8;
    --border: rgba(91,141,184,0.2);
    --border-bright: rgba(91,141,184,0.55);
    --row-hover: rgba(91,141,184,0.07);
    --row-active: rgba(91,141,184,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
  }

  /* Texture carta sottile */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* Pellicola orizzontale in fondo alla pagina come decorazione */
  body::after {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 52px;
    background:
      linear-gradient(var(--strip-bg), var(--strip-bg)),
      repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 8px,
        var(--bg) 8px,
        var(--bg) 30px,
        transparent 30px,
        transparent 38px
      );
    background-blend-mode: normal;
    border-top: 2px solid var(--strip-hole);
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }

  /* ── HEADER ── */
  header {
    margin-bottom: 32px;
    border: 1px solid var(--border);
    padding: 22px 26px 18px;
    position: relative;
    background: var(--bg-card);
    box-shadow: 0 2px 12px rgba(91,141,184,0.1);
  }

  /* Barra superiore: gradiente oro → azzurro */
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--blue-light));
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 14px;
  }

  .projector-icon {
    font-size: 2rem;
    line-height: 1;
    filter: drop-shadow(0 0 6px rgba(91,141,184,0.35));
  }

  .header-main { flex: 1; }

  .header-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.42em;
    color: var(--blue-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.3rem, 3vw, 1.85rem);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1;
  }

  .header-title span { color: var(--gold); }

  .header-date {
    font-size: 0.7rem;
    color: var(--blue-dim);
    letter-spacing: 0.2em;
    margin-top: 4px;
  }

  .header-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 4px;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-label {
    font-size: 0.62rem;
    letter-spacing: 0.28em;
    color: var(--blue-dim);
    text-transform: uppercase;
  }

  .search-input {
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--border-bright);
    padding: 4px 8px;
    color: var(--ink);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    width: 210px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--blue-pale); }
  .search-input:focus { border-color: var(--blue); }

  /* Badge LIVE: azzurro su sfondo chiaro */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    color: #cc2200;
    text-transform: uppercase;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #cc2200;
    animation: livePulse 1.5s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(204,34,0,0.5); }
    50%       { opacity: 0.6; box-shadow: 0 0 0 5px rgba(204,34,0,0); }
  }

  /* ── GUEST MATCH PANEL ── */
  .guest-match {
    margin-bottom: 22px;
    border: 1.5px solid var(--blue);
    background: var(--bg-card);
    animation: rowIn 0.3s both;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(91,141,184,0.12);
  }

  .guest-match-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(91,141,184,0.07);
  }

  .gm-icon { font-size: 1.1rem; }

  .gm-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--blue);
  }

  .gm-count {
    margin-left: auto;
    font-size: 0.6rem;
    color: var(--blue-dim);
    letter-spacing: 0.15em;
  }

  .guest-match-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    gap: 16px;
  }

  .guest-match-row:last-child { border-bottom: none; }
  .guest-match-row:hover { background: var(--row-hover); }

  .gm-guest-name {
    font-family: 'Oswald', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .gm-guest-name mark {
    background: transparent;
    color: var(--gold);
  }

  .gm-table-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* Pill tavolo: bordo e testo oro */
  .gm-table-pill {
    font-family: 'Oswald', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    background: rgba(184,134,11,0.06);
    white-space: nowrap;
  }

  .gm-movie {
    font-size: 0.7rem;
    color: var(--blue-dim);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* ── BOARD ── */
  .board {
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--bg-card);
    box-shadow: 0 2px 16px rgba(91,141,184,0.1);
  }

  /* Header colonne: bordo inferiore gradiente oro→azzurro */
  .board-header {
    display: grid;
    grid-template-columns: 90px 100px 1fr 90px;
    background: var(--bg-warm);
    border-bottom: 2px solid;
    border-image: linear-gradient(90deg, var(--gold), var(--blue-light)) 1;
    padding: 0;
  }

  .col-head {
    font-family: 'Oswald', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--blue-dim);
    padding: 10px 16px;
    border-right: 1px solid var(--border);
  }

  .col-head:last-child { border-right: none; text-align: right; }

  /* Righe */
  .board-row {
    display: grid;
    grid-template-columns: 90px 100px 1fr 90px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: var(--bg-card);
    transition: background 0.15s;
    position: relative;
    animation: rowIn 0.4s both;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .board-row:last-child { border-bottom: none; }
  .board-row:hover { background: var(--row-hover); }

  /* Riga attiva: sfondo azzurro tenue + linea sinistra oro→azzurro */
  .board-row.active { background: var(--row-active); }

  .board-row.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--gold), var(--blue));
  }

  .cell {
    padding: 13px 16px;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    font-size: 0.86rem;
    letter-spacing: 0.05em;
  }

  .cell:last-child { border-right: none; }

  .cell-time {
    color: var(--blue-dim);
    font-size: 0.83rem;
    letter-spacing: 0.09em;
  }

  .cell-sala {
    color: var(--blue-dim);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
  }

  .cell-sala strong {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
  }

  .board-row.active .cell-sala strong { color: var(--blue); }

  .cell-movie {
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }

  .movie-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    transition: color 0.2s;
  }

  .board-row:hover .movie-name,
  .board-row.active .movie-name { color: var(--blue); }

  .movie-meta {
    font-size: 0.68rem;
    color: var(--blue-dim);
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .movie-emoji { font-size: 0.75rem; }

  .cell-stato { justify-content: flex-end; }

  /* Badge stato */
  .stato-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 0.58rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 1px;
    color: var(--blue-pale);
    transition: all 0.2s;
  }

  /* Badge active: oro con pulse */
  .board-row.active .stato-badge {
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(184,134,11,0.07);
    animation: badgePulse 2s ease-in-out infinite;
  }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,134,11,0); }
    50%       { box-shadow: 0 0 8px 2px rgba(184,134,11,0.2); }
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 48px;
    color: var(--blue-dim);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    border-bottom: 1px solid var(--border);
  }

  /* Footer */
  .board-footer {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .footer-note {
    font-size: 0.62rem;
    color: var(--blue-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-style: italic;
  }

  .total-count {
    font-size: 0.62rem;
    color: var(--blue-dim);
    letter-spacing: 0.15em;
  }

  .total-count span { color: var(--gold); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(91,141,184,0.25); }

  /* ── SLIDESHOW BUTTON ── */
  #slideshowBtn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--blue-dim);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 1px;
  }
  #slideshowBtn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: rgba(91,141,184,0.07);
  }
  #slideshowBtn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(184,134,11,0.07);
    animation: badgePulse 2s ease-in-out infinite;
  }
</style>
</head>
<body>
<div class="page-wrapper">

  <header>
    <div class="header-top">
      <div class="projector-icon">📽</div>
      <div class="header-main">
        <p class="header-label">Now Showing — Find Your Table</p>
        <h1 class="header-title">Federica <span>&</span> Alessandro</h1>
        <p class="header-date">Lunedì 14 Settembre 2026 · Hotel Villa Bregana</p>
      </div>
    </div>
    <div class="header-bottom">
      <div class="search-wrap">
        <span class="search-label">CERCA</span>
        <input class="search-input" type="text" id="searchInput" placeholder="nome, film, sala…">
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
      <button id="slideshowBtn" onclick="toggleSlideshow()" title="Avvia slideshow automatico sul Display">
        ▶ SLIDESHOW
      </button>
    </div>
  </header>

  <div id="guestMatchPanel"></div>

  <div class="board">
    <div class="board-header">
      <div class="col-head">Orario</div>
      <div class="col-head">Sala</div>
      <div class="col-head">Titolo</div>
      <div class="col-head" style="text-align:right">Stato</div>
    </div>
    <div id="boardBody"></div>
  </div>

  <div class="board-footer">
    <p class="footer-note">🎞 Seleziona un tavolo per visualizzarlo sul secondo schermo</p>
    <p class="total-count" id="countLabel"></p>
  </div>

</div>

<script>
const tables = [
  { id:1,  movie:"Harry Potter",             year:"2001", emoji:"🎩", color:"#3a6a9a", guests:["Alessia Cavicchio","Michela Galli","Eleonora Perotta","Francesco Mammoliti","Fidanzata Francesco","Arianna Bressan"] },
  { id:2,  movie:"Fast & Furious",           year:"2001", emoji:"🍾", color:"#5080a0", guests:["Martina Paganini","Luca Nozzolillo","Barbara Colombo","Gabriele","Kevin Re","Davide Collato","Alessandro Collato","Chiara Lange","Lorenzo Tinelli","Dario Granvillano"] },
  { id:3,  movie:"The Avengers",             year:"2012", emoji:"📽️", color:"#4878a8", guests:["Marco Sardina","Aurora Carretta","Giorgia Bonanno","Francesco Mammoliti","Stefano Bonanno","Alessia de Benedetto","Aurora de Benedetto","Tommaso","Federico Zigrillo","Antonella"] },
  { id:4,  movie:"Twilight",                 year:"2008", emoji:"🥀", color:"#607090", guests:["Elisabetta Ancona","Emanuele Sardina","Lucrezia Ancona","Francesco Bonanno","Angela Ancona","Sebastiano Zigrillo","Mario Ancona","Dino de Benedetto","Ombretta"] },
  { id:5,  movie:"Il Signore degli Anelli",  year:"2001", emoji:"⚓", color:"#4070a0", guests:["Elisabetta Sola","Roberto Truzzi","Massimiliano Loreggiola","Silvia Mussini","Daniela de Bernardi","Anna Monolo","Tiziano Sola","Sara Sola","Niccolò Zanzottera","Daniel Zanzottera","? Zanzottera"] },
  { id:6,  movie:"Footloose",                year:"2011", emoji:"🛵", color:"#5890b8", guests:["Alessia Truzzi","Arianna Truzzi","Alice Loreggiola","Fidanzato Alice","Sara Truzzi","Stefano Venturini","Lorenzo Venturini","Enza De Santis"] },
  { id:7,  movie:"I Pirati dei Caraibi",     year:"2003", emoji:"🚀", color:"#3868a0", guests:["Lidia Spina","Davide Spina","Giuseppina Sardina","Francesco Spina","Sebastiano Sardina","Isabella","Giuseppe Sardina","Sofia Sardina","Angelo","Angela Sardina"] },
  { id:8,  movie:"50 Volte il primo bacio",  year:"2004", emoji:"🌟", color:"#6090b0", guests:["Valentina Ligas","Federico Caironi","Melissa Caironi","Alessandra Caironi","Valeria Ligas","Giuseppe","Francesca Monolo","Marina Mazza","Ernesto Monolo","Gianna Monolo","Giorgio Ligas"] },
  { id:9,  movie:"Una Notte da Leoni",       year:"2009", emoji:"🌧️", color:"#4878a0", guests:["Walter Buongiovanni","Loredana","Giorgia Buongiovanni","Matteo Buongiovanni","Ilaria Garruto","Francesco Garruto","Anna","Cristina Radaelli","Beatrice Ghiringhelli","Matteo Ghiringhelli"] },
  { id:10, movie:"Hunger Games",             year:"2012", emoji:"💎", color:"#5080b0", guests:["Giorgio Ancona","Patrizia","Riccardo Ancona","Alessandro Ancona","Fidanzata Alessandro","Maila Ancona","Francesca Ancona"] },
  { id:11, movie:"Forrest Gump",             year:"1994", emoji:"💎", color:"#4070a0", guests:["Nicola Ancona","Mina","Giovanni Ancona","Raffaella","Antonio Ancona","Irene","Carlo Ancona","Lina"] },
  { id:12, movie:"Avatar",                   year:"2009", emoji:"💎", color:"#3878a8", guests:["Giovanni Totaro","Marinella","Francesca Totaro","Angela Totaro","Zio Gino"] },
  { id:13, movie:"Quo Vado",                 year:"2016", emoji:"💎", color:"#5888a8", guests:["Antonia De Bernardi","Claudio","Rosangela Sola","Pinuccia Sola","Pinuccio","Adelina Ceolato","Ezio Sola","Santina Sola"] },
  { id:14, movie:"Bohemian Rapsody",         year:"2018", emoji:"💎", color:"#4880b0", guests:["Vladlena Nikolaevna Lvova","Carmelina Polichetti","Francesca Riccardo","Maria Grazia Rosa Sbarra","Matteo Manzelli","Alessio Giuseppe Paleari"] },
  { id:15, movie:"Fall Guy",                 year:"2024", emoji:"💎", color:"#507090", guests:["FOTOGRAFI","DJ"] }
];

const startMinutes = 18 * 60;
function getTime(i) {
  const m = startMinutes + i * 15;
  const h = Math.floor(m / 60);
  const min = m % 60;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}

let activeTable = null;
const channel = new BroadcastChannel('matrimonio_tavoli');

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function renderGuestMatches(q) {
  const panel = document.getElementById('guestMatchPanel');
  if (!q || q.length < 2) { panel.innerHTML = ''; return; }

  const matches = [];
  tables.forEach(t => {
    t.guests.forEach(g => {
      if (g.toLowerCase().includes(q.toLowerCase()))
        matches.push({ guest: g, table: t });
    });
  });

  if (!matches.length) { panel.innerHTML = ''; return; }

  panel.innerHTML = `
    <div class="guest-match">
      <div class="guest-match-header">
        <span class="gm-icon">🎟</span>
        <span class="gm-label">Ospiti trovati</span>
        <span class="gm-count">${matches.length} risultat${matches.length === 1 ? 'o' : 'i'}</span>
      </div>
      ${matches.map(m => `
        <div class="guest-match-row" onclick="selectTable(${m.table.id})">
          <span class="gm-guest-name">${highlightMatch(m.guest, q)}</span>
          <div class="gm-table-info">
            <span class="gm-movie">${m.table.emoji} ${m.table.movie}</span>
            <span class="gm-table-pill">SALA ${String(m.table.id).padStart(2,'0')}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderRows(filter = '') {
  const body = document.getElementById('boardBody');
  const q = filter.toLowerCase();

  const filtered = tables.filter(t =>
    t.movie.toLowerCase().includes(q) ||
    String(t.id).includes(q) ||
    t.year.includes(q)
  );

  body.innerHTML = filtered.map((t, i) => `
    <div class="board-row ${activeTable === t.id ? 'active' : ''}"
         onclick="selectTable(${t.id})"
         style="animation-delay:${i * 0.04}s">
      <div class="cell cell-time">${getTime(t.id - 1)}</div>
      <div class="cell cell-sala">SALA&nbsp;<strong>${String(t.id).padStart(2,'0')}</strong></div>
      <div class="cell cell-movie">
        <span class="movie-name">${t.movie}</span>
        <span class="movie-meta">
          <span class="movie-emoji">${t.emoji}</span>
          ${t.year} &nbsp;·&nbsp; ${t.guests.length} ospiti
        </span>
      </div>
      <div class="cell cell-stato">
        <span class="stato-badge">${activeTable === t.id ? '● IN DISPLAY' : 'LIBERO'}</span>
      </div>
    </div>
  `).join('');
}

function selectTable(id) {
  activeTable = id;
  const table = tables.find(t => t.id === id);
  channel.postMessage({ type: 'SELECT_TABLE', table });
  localStorage.setItem('selectedTable', JSON.stringify(table));

  // Svuota la barra di ricerca e ripristina la lista
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('guestMatchPanel').innerHTML = '';
  document.querySelector('.board').style.display = 'block';
  document.querySelector('.board-footer').style.display = 'flex';

  renderRows('');
}

document.getElementById('searchInput').addEventListener('input', e => {
  const val = e.target.value;
  renderGuestMatches(val);

  const hasGuestMatches = tables.some(t =>
    t.guests.some(g => g.toLowerCase().includes(val.toLowerCase()))
  );

  document.querySelector('.board').style.display =
    hasGuestMatches && val.length >= 2 ? 'none' : 'block';
  document.querySelector('.board-footer').style.display =
    hasGuestMatches && val.length >= 2 ? 'none' : 'flex';

  renderRows(val);
});

// ── SLIDESHOW CONTROL ──
let slideshowActive = false;
function toggleSlideshow() {
  slideshowActive = !slideshowActive;
  const btn = document.getElementById('slideshowBtn');
  if (slideshowActive) {
    btn.textContent = '⏹ STOP';
    btn.classList.add('active');
    channel.postMessage({ type: 'START_SLIDESHOW' });
  } else {
    btn.textContent = '▶ SLIDESHOW';
    btn.classList.remove('active');
    channel.postMessage({ type: 'STOP_SLIDESHOW' });
  }
}

// Sync updates from Display back to Lista
channel.addEventListener('message', e => {
  if (e.data.type === 'SLIDESHOW_ACTIVE') {
    activeTable = e.data.tableId;
    renderRows(document.getElementById('searchInput').value);
  }
  if (e.data.type === 'SLIDESHOW_STARTED') {
    const input = document.getElementById('searchInput');
    input.value = '';
    document.getElementById('guestMatchPanel').innerHTML = '';
    document.querySelector('.board').style.display = 'block';
    document.querySelector('.board-footer').style.display = 'flex';
    renderRows('');
  }
});

const saved = localStorage.getItem('selectedTable');
if (saved) {
  try { activeTable = JSON.parse(saved).id; } catch(e) {}
}

renderRows();
</script>
</body>
</html>
