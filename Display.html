<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrimonio — Display Tavolo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --gold-pale: #f5e6b8;
    --crimson: #8b1a2b;
    --dark: #0a0806;
    --dark-mid: #140f0a;
    --cream: #f5eed8;
    --silver: #c0c0c0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Film grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  /* ── IDLE SCREEN ── */
  #idleScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    background: var(--dark);
    transition: opacity 0.8s ease;
  }

  #idleScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .idle-projector {
    font-size: 5rem;
    animation: projectorPulse 3s ease-in-out infinite;
  }

  @keyframes projectorPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.3)); opacity: 0.7; }
    50% { filter: drop-shadow(0 0 24px rgba(201,168,76,0.7)); opacity: 1; }
  }

  .idle-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-pale) 0%, var(--gold) 50%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    padding: 0 20px;
  }

  .idle-sub {
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.5);
    font-style: italic;
    animation: blink 2.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .film-strip-idle {
    display: flex;
    gap: 6px;
    margin-top: 20px;
  }
  .fs-hole {
    width: 20px; height: 14px;
    border: 1.5px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    animation: stripScroll 2s linear infinite;
  }
  @keyframes stripScroll {
    0%   { opacity: 0.3; }
    50%  { opacity: 0.8; }
    100% { opacity: 0.3; }
  }
  .fs-hole:nth-child(2) { animation-delay: 0.3s; }
  .fs-hole:nth-child(3) { animation-delay: 0.6s; }
  .fs-hole:nth-child(4) { animation-delay: 0.9s; }
  .fs-hole:nth-child(5) { animation-delay: 1.2s; }
  .fs-hole:nth-child(6) { animation-delay: 1.5s; }

  /* ── MAIN DISPLAY ── */
  #display {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 50px;
  }

  #display.visible { display: flex; }

  /* Vignette */
  #display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* Dynamic bg */
  .bg-glow {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    transition: background 1s ease;
    pointer-events: none;
  }

  /* Decorative corner lines */
  .corner {
    position: absolute;
    width: 50px;
    height: 50px;
    border-color: rgba(201,168,76,0.3);
    border-style: solid;
  }
  .corner-tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }

  /* Film strip top/bottom */
  .film-strip-h {
    position: absolute;
    left: 0; right: 0;
    height: 30px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
  }
  .film-strip-h.top { top: 0; }
  .film-strip-h.bottom { bottom: 0; }

  .film-strip-h::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    border-bottom: 1px solid rgba(201,168,76,0.1);
  }
  .film-strip-h.bottom::before { border-bottom: none; border-top: 1px solid rgba(201,168,76,0.1); }

  .fh-hole {
    position: relative;
    min-width: 22px;
    height: 16px;
    border: 1.5px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    margin: 0 5px;
    flex-shrink: 0;
  }

  /* ── CONTENT ── */
  .content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 900px;
    gap: 0;
  }

  .table-tag {
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }

  .movie-emoji-display {
    font-size: clamp(3.5rem, 8vw, 6rem);
    margin-bottom: 10px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.8));
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }

  .movie-title-display {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    font-weight: 900;
    font-style: italic;
    text-align: center;
    line-height: 1.05;
    background: linear-gradient(135deg, var(--gold-pale) 0%, var(--gold) 40%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s 0.3s forwards;
    letter-spacing: -0.01em;
  }

  .movie-year-display {
    font-size: 1rem;
    color: rgba(192,192,192,0.55);
    font-style: italic;
    letter-spacing: 0.25em;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
  }

  /* Divider ornament */
  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.6s 0.45s forwards;
    width: 100%;
    max-width: 600px;
  }

  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
  }
  .ornament-icon { color: var(--gold); font-size: 1.1rem; }

  /* Guests grid */
  .guests-container {
    width: 100%;
    max-width: 800px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
  }

  .guests-label {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.5);
    margin-bottom: 18px;
  }

  .guests-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }

  .guest-chip {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 2px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s;
  }

  .guest-chip:hover {
    background: rgba(201,168,76,0.07);
    border-color: rgba(201,168,76,0.35);
  }

  .guest-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(201,168,76,0.3), rgba(201,168,76,0.1));
    border: 1px solid rgba(201,168,76,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    flex-shrink: 0;
  }

  .guest-name {
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Bottom info */
  .bottom-info {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.65s forwards;
  }

  .bottom-info-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .bi-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
  }

  .bi-label {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.45);
  }

  .bi-sep {
    width: 1px;
    height: 36px;
    background: rgba(201,168,76,0.2);
  }

  /* Couple watermark */
  .couple-watermark {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: rgba(201,168,76,0.25);
    letter-spacing: 0.2em;
    white-space: nowrap;
    z-index: 2;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .content-wrapper > * {
    /* Each child resets animation when parent re-renders */
  }

  /* Transition overlay */
  #transitionOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #transitionOverlay.flash { opacity: 0.6; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); }
</style>
</head>
<body>

<div id="transitionOverlay"></div>

<!-- Idle screen -->
<div id="idleScreen">
  <div class="idle-projector">📽️</div>
  <h1 class="idle-title">Sophia &amp; Marco</h1>
  <p class="idle-sub">In attesa del tavolo…</p>
  <div class="film-strip-idle">
    <div class="fs-hole"></div><div class="fs-hole"></div>
    <div class="fs-hole"></div><div class="fs-hole"></div>
    <div class="fs-hole"></div><div class="fs-hole"></div>
  </div>
</div>

<!-- Display -->
<div id="display">
  <div class="bg-glow" id="bgGlow"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Film strips -->
  <div class="film-strip-h top" id="stripTop"></div>
  <div class="film-strip-h bottom" id="stripBottom"></div>

  <div class="content-wrapper" id="contentWrapper">
    <!-- Populated by JS -->
  </div>

  <div class="couple-watermark">Sophia &amp; Marco · 14 Giugno 2025</div>
</div>

<script>
const channel = new BroadcastChannel('matrimonio_tavoli');

function buildFilmStrip(el) {
  el.innerHTML = '';
  const count = Math.floor(window.innerWidth / 32) + 2;
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'fh-hole';
    el.appendChild(h);
  }
}

buildFilmStrip(document.getElementById('stripTop'));
buildFilmStrip(document.getElementById('stripBottom'));

function showTable(table) {
  const overlay = document.getElementById('transitionOverlay');
  overlay.classList.add('flash');

  setTimeout(() => {
    overlay.classList.remove('flash');
    renderTable(table);
  }, 250);
}

function renderTable(table) {
  const idle = document.getElementById('idleScreen');
  const display = document.getElementById('display');
  const glow = document.getElementById('bgGlow');
  const wrapper = document.getElementById('contentWrapper');

  idle.classList.add('hidden');
  display.classList.add('visible');

  // Background glow
  glow.style.background = `radial-gradient(ellipse at center, ${table.color}88 0%, transparent 70%)`;

  // Build content (re-render to retrigger animations)
  const guestChips = table.guests.map((g, i) => {
    const initials = g.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    return `
      <div class="guest-chip" style="animation:fadeUp 0.4s ${0.55 + i*0.06}s both">
        <div class="guest-avatar">${initials}</div>
        <span class="guest-name">${g}</span>
      </div>`;
  }).join('');

  wrapper.innerHTML = `
    <p class="table-tag">✦ Tavolo ${table.id} ✦</p>
    <div class="movie-emoji-display">${table.emoji}</div>
    <h2 class="movie-title-display">${table.movie}</h2>
    <p class="movie-year-display">${table.year}</p>

    <div class="ornament">
      <span class="ornament-line"></span>
      <span class="ornament-icon">🎬</span>
      <span class="ornament-line"></span>
    </div>

    <div class="guests-container">
      <p class="guests-label">Ospiti al tavolo</p>
      <div class="guests-grid">${guestChips}</div>
    </div>

    <div class="bottom-info">
      <div class="bottom-info-item">
        <span class="bi-value">${table.id}</span>
        <span class="bi-label">N° Tavolo</span>
      </div>
      <div class="bi-sep"></div>
      <div class="bottom-info-item">
        <span class="bi-value">${table.guests.length}</span>
        <span class="bi-label">Ospiti</span>
      </div>
      <div class="bi-sep"></div>
      <div class="bottom-info-item">
        <span class="bi-value">${table.year}</span>
        <span class="bi-label">Anno film</span>
      </div>
    </div>
  `;
}

// Listen for messages from the LISTA page
channel.addEventListener('message', e => {
  if (e.data.type === 'SELECT_TABLE') {
    showTable(e.data.table);
  }
});

// On load, check if a table is already saved
const saved = localStorage.getItem('selectedTable');
if (saved) {
  try {
    const table = JSON.parse(saved);
    renderTable(table);
  } catch(e) {}
}

// Color map for tables (matching lista.html)
const colorMap = {
  1: "#2a1f0e", 2: "#0e1a2a", 3: "#1a0e0e", 4: "#0a150a", 5: "#0a0f1a",
  6: "#1a1505", 7: "#05051a", 8: "#1a1205", 9: "#08100a", 10: "#1a0f1a"
};

// Patch color into table object if missing
const _orig = channel.onmessage;
</script>
</body>
</html>
