<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrimonio — Display Tavolo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --gold-pale: #f5e6b8;
    --crimson: #8b1a2b;
    --dark: #0a0806;
    --dark-mid: #140f0a;
    --cream: #f5eed8;
    --silver: #c0c0c0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Film grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  /* ── IDLE SCREEN ── */
  #idleScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    background: var(--dark);
    transition: opacity 0.8s ease;
  }

  #idleScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .idle-projector {
    font-size: 5rem;
    animation: projectorPulse 3s ease-in-out infinite;
  }

  @keyframes projectorPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.3)); opacity: 0.7; }
    50% { filter: drop-shadow(0 0 24px rgba(201,168,76,0.7)); opacity: 1; }
  }

  .idle-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-pale) 0%, var(--gold) 50%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    padding: 0 20px;
  }

  .idle-sub {
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.5);
    font-style: italic;
    animation: blink 2.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .film-strip-idle {
    display: flex;
    gap: 6px;
    margin-top: 20px;
  }
  .fs-hole {
    width: 20px; height: 14px;
    border: 1.5px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    animation: stripScroll 2s linear infinite;
  }
  @keyframes stripScroll {
    0%   { opacity: 0.3; }
    50%  { opacity: 0.8; }
    100% { opacity: 0.3; }
  }
  .fs-hole:nth-child(2) { animation-delay: 0.3s; }
  .fs-hole:nth-child(3) { animation-delay: 0.6s; }
  .fs-hole:nth-child(4) { animation-delay: 0.9s; }
  .fs-hole:nth-child(5) { animation-delay: 1.2s; }
  .fs-hole:nth-child(6) { animation-delay: 1.5s; }

  /* ── MAIN DISPLAY ── */
  #display {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 50px;
  }

  #display.visible { display: flex; }

  /* Vignette */
  #display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* Dynamic bg */
  .bg-glow {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    transition: background 1s ease;
    pointer-events: none;
  }

  /* Decorative corner lines */
  .corner {
    position: absolute;
    width: 50px;
    height: 50px;
    border-color: rgba(201,168,76,0.3);
    border-style: solid;
  }
  .corner-tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }

  /* Film strip top/bottom */
  .film-strip-h {
    position: absolute;
    left: 0; right: 0;
    height: 30px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
  }
  .film-strip-h.top { top: 0; }
  .film-strip-h.bottom { bottom: 0; }

  .film-strip-h::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    border-bottom: 1px solid rgba(201,168,76,0.1);
  }
  .film-strip-h.bottom::before { border-bottom: none; border-top: 1px solid rgba(201,168,76,0.1); }

  .fh-hole {
    position: relative;
    min-width: 22px;
    height: 16px;
    border: 1.5px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    margin: 0 5px;
    flex-shrink: 0;
  }

  /* ── CONTENT ── */
  .content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 900px;
    gap: 0;
  }

  .table-tag {
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }

  .movie-emoji-display {
    font-size: clamp(3.5rem, 8vw, 6rem);
    margin-bottom: 10px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.8));
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }

  .movie-title-display {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    font-weight: 900;
    font-style: italic;
    text-align: center;
    line-height: 1.05;
    background: linear-gradient(135deg, var(--gold-pale) 0%, var(--gold) 40%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s 0.3s forwards;
    letter-spacing: -0.01em;
  }

  .movie-year-display {
    font-size: 1rem;
    color: rgba(192,192,192,0.55);
    font-style: italic;
    letter-spacing: 0.25em;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
  }

  /* Divider ornament */
  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.6s 0.45s forwards;
    width: 100%;
    max-width: 600px;
  }

  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
  }
  .ornament-icon { color: var(--gold); font-size: 1.1rem; }

  /* Guests grid */
  .guests-container {
    width: 100%;
    max-width: 800px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
  }

  .guests-label {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.5);
    margin-bottom: 18px;
  }

  .guests-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }

  .guest-chip {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 2px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s;
  }

  .guest-chip:hover {
    background: rgba(201,168,76,0.07);
    border-color: rgba(201,168,76,0.35);
  }

  .guest-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(201,168,76,0.3), rgba(201,168,76,0.1));
    border: 1px solid rgba(201,168,76,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    flex-shrink: 0;
  }

  .guest-name {
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Bottom info */
  .bottom-info {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.65s forwards;
  }

  .bottom-info-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .bi-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
  }

  .bi-label {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.45);
  }

  .bi-sep {
    width: 1px;
    height: 36px;
    background: rgba(201,168,76,0.2);
  }

  /* Couple watermark */
  .couple-watermark {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: rgba(201,168,76,0.25);
    letter-spacing: 0.2em;
    white-space: nowrap;
    z-index: 2;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .content-wrapper > * {
    /* Each child resets animation when parent re-renders */
  }

  /* Transition overlay */
  #transitionOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #transitionOverlay.flash { opacity: 0.6; }

  .guest-chip.spotlight {
    border-color: var(--gold) !important;
    background: rgba(201,168,76,0.13) !important;
    box-shadow: 0 0 0 1px rgba(201,168,76,0.35), 0 0 20px 4px rgba(201,168,76,0.18);
    animation: spotlightPulse 2.2s ease-in-out infinite !important;
    position: relative;
    z-index: 1;
  }

  .guest-chip.spotlight .guest-avatar {
    background: linear-gradient(135deg, rgba(201,168,76,0.65), rgba(201,168,76,0.25));
    border-color: var(--gold);
    color: #fff;
    box-shadow: 0 0 10px rgba(201,168,76,0.5);
  }

  .guest-chip.spotlight .guest-name {
    color: var(--gold-pale);
    font-weight: 600;
  }

  @keyframes spotlightPulse {
    0%, 100% {
      box-shadow: 0 0 0 1px rgba(201,168,76,0.35), 0 0 16px 4px rgba(201,168,76,0.15);
    }
    50% {
      box-shadow: 0 0 0 2px rgba(201,168,76,0.6), 0 0 32px 10px rgba(201,168,76,0.28);
    }
  }

  /* Star particle that floats above the highlighted chip */
  .guest-chip.spotlight::after {
    content: '✦';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: var(--gold);
    animation: starFloat 2.2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes starFloat {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) translateY(0); }
    50%       { opacity: 1;   transform: translateX(-50%) translateY(-5px); }
  }

  /* ── CIAK OVERLAY ── */
  #ciakOverlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #ciakOverlay.show { opacity: 1; pointer-events: none; }

  #ciakSVG {
    width: min(420px, 85vw);
    filter: drop-shadow(0 0 30px rgba(201,168,76,0.3));
  }

  #ciakTop {
    transform: rotate(-35deg);
    transform-box: fill-box;
    transform-origin: left bottom;
    transition: transform 0.18s cubic-bezier(0.4,0,0.2,1);
  }
  #ciakTop.slam {
    transform: rotate(0deg);
    transform-box: fill-box;
    transform-origin: left bottom;
  }

  /* ── SLIDESHOW BAR ── */
  #slideshowBar {
    position: fixed;
    bottom: 36px;
    right: 24px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(201,168,76,0.2);
    padding: 6px 12px 6px 6px;
    border-radius: 2px;
    backdrop-filter: blur(4px);
  }

  #slideshowProgress {
    width: 80px;
    height: 3px;
    background: rgba(201,168,76,0.15);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  #slideshowProgress::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    width: 0%;
    transition: width linear;
  }
  #slideshowProgress.running::after {
    width: 100%;
  }

  #slideshowLabel {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: rgba(201,168,76,0.5);
    font-family: 'Cormorant Garamond', serif;
    text-transform: uppercase;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); }
</style>
</head>

// ── FILM STRIP ──
function buildFilmStrip(el) {
  el.innerHTML = '';
  const count = Math.floor(window.innerWidth / 32) + 2;
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'fh-hole';
    el.appendChild(h);
  }
}
buildFilmStrip(document.getElementById('stripTop'));
buildFilmStrip(document.getElementById('stripBottom'));

// ── CIAK TRANSITION ──
function doCiak(callback) {
  const overlay = document.getElementById('ciakOverlay');
  const top = document.getElementById('ciakTop');

  // 1. Fade in overlay
  overlay.classList.add('show');
  top.classList.remove('slam');

  // 2. After brief pause, slam the ciak down
  setTimeout(() => {
    top.classList.add('slam');

    // 3. Hold for a beat, then run callback + fade out
    setTimeout(() => {
      callback();
      setTimeout(() => {
        overlay.classList.remove('show');
        top.classList.remove('slam');
      }, 180);
    }, 320);
  }, 150);
}

function showTable(table, highlightedGuest, useCiak = true) {
  if (useCiak) {
    doCiak(() => renderTable(table, highlightedGuest));
  } else {
    renderTable(table, highlightedGuest);
  }
}

function renderTable(table, highlightedGuest) {
  const idle = document.getElementById('idleScreen');
  const display = document.getElementById('display');
  const glow = document.getElementById('bgGlow');
  const wrapper = document.getElementById('contentWrapper');

  idle.classList.add('hidden');
  display.classList.add('visible');

  glow.style.background = `radial-gradient(ellipse at center, ${table.color}88 0%, transparent 70%)`;

  const guestChips = table.guests.map((g, i) => {
    const initials = g.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const isSpotlight = highlightedGuest && g === highlightedGuest;
    return `
      <div class="guest-chip${isSpotlight ? ' spotlight' : ''}" style="animation:fadeUp 0.4s ${0.55 + i*0.06}s both" data-guest="${g.replace(/"/g,'&quot;')}">
        <div class="guest-avatar">${initials}</div>
        <span class="guest-name">${g}</span>
      </div>`;
  }).join('');

  wrapper.innerHTML = `
    <p class="table-tag">✦ Tavolo ${table.id} ✦</p>
    <div class="movie-emoji-display">${table.emoji}</div>
    <h2 class="movie-title-display">${table.movie}</h2>
    <p class="movie-year-display">${table.year}</p>

    <div class="ornament">
      <span class="ornament-line"></span>
      <span class="ornament-icon">🎬</span>
      <span class="ornament-line"></span>
    </div>

    <div class="guests-container">
      <p class="guests-label">Ospiti al tavolo</p>
      <div class="guests-grid">${guestChips}</div>
    </div>

    <div class="bottom-info">
      <div class="bottom-info-item">
        <span class="bi-value">${table.id}</span>
        <span class="bi-label">N° Tavolo</span>
      </div>
      <div class="bi-sep"></div>
      <div class="bottom-info-item">
        <span class="bi-value">${table.guests.length}</span>
        <span class="bi-label">Ospiti</span>
      </div>
      <div class="bi-sep"></div>
      <div class="bottom-info-item">
        <span class="bi-value">${table.year}</span>
        <span class="bi-label">Anno film</span>
      </div>
    </div>
  `;
}

// ── SLIDESHOW ──
const SLIDE_DURATION = 12000; // ms per tavolo
let slideshowTimer = null;
let slideshowIndex = 0;
let isSlideshow = false;

function startSlideshow() {
  if (isSlideshow) return;
  isSlideshow = true;
  slideshowIndex = 0;

  // Tell Lista to clear the search bar
  channel.postMessage({ type: 'SLIDESHOW_STARTED' });

  const bar = document.getElementById('slideshowBar');
  bar.style.display = 'flex';

  runSlide();
}

function runSlide() {
  if (!isSlideshow) return;

  const table = tables[slideshowIndex % tables.length];
  showTable(table, null, true);

  // Notify Lista to highlight this row
  channel.postMessage({ type: 'SLIDESHOW_ACTIVE', tableId: table.id });

  // Animate progress bar
  const prog = document.getElementById('slideshowProgress');
  prog.classList.remove('running');
  prog.style.transition = 'none';
  prog.style.setProperty('--w', '0%');
  // Force reflow
  void prog.offsetWidth;
  prog.style.transition = `width ${SLIDE_DURATION}ms linear`;
  prog.classList.add('running');
  // Actually drive the ::after via a direct inner element approach
  prog.innerHTML = `<div id="progFill" style="height:100%;background:var(--gold);border-radius:2px;width:0%;transition:width ${SLIDE_DURATION}ms linear"></div>`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const fill = document.getElementById('progFill');
      if (fill) fill.style.width = '100%';
    });
  });

  slideshowTimer = setTimeout(() => {
    slideshowIndex = (slideshowIndex + 1) % tables.length;
    runSlide();
  }, SLIDE_DURATION);
}

function stopSlideshow() {
  if (!isSlideshow) return;
  isSlideshow = false;
  clearTimeout(slideshowTimer);
  slideshowTimer = null;
  const bar = document.getElementById('slideshowBar');
  bar.style.display = 'none';
}

// Start slideshow automatically after 5s of idle
const idleScreen = document.getElementById('idleScreen');
let idleSlideshowTimer = setTimeout(() => {
  startSlideshow();
}, 5000);

// ── INACTIVITY SLIDESHOW RESTART ──
const INACTIVITY_MS = 20000;
let inactivityTimer = null;

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (!isSlideshow) startSlideshow();
  }, INACTIVITY_MS);
}

// ── BROADCAST LISTENER ──
channel.addEventListener('message', e => {
  if (e.data.type === 'SELECT_TABLE') {
    stopSlideshow();
    clearTimeout(idleSlideshowTimer);
    showTable(e.data.table, e.data.highlightedGuest || null, true);
    localStorage.setItem('selectedTable', JSON.stringify(e.data.table));
    localStorage.setItem('highlightedGuest', e.data.highlightedGuest || '');
    resetInactivityTimer();
  }
  if (e.data.type === 'START_SLIDESHOW') {
    startSlideshow();
  }
  if (e.data.type === 'STOP_SLIDESHOW') {
    stopSlideshow();
  }
});

// ── ON LOAD: restore last table ──
const saved = localStorage.getItem('selectedTable');
if (saved) {
  try {
    const table = JSON.parse(saved);
    const savedGuest = localStorage.getItem('highlightedGuest') || null;
    clearTimeout(idleSlideshowTimer);
    renderTable(table, savedGuest);
  } catch(e) {}
}
</script>
